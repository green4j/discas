name: Check and Verify

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job calling one Gradle task per JDK. The definition of "green" lives in build.gradle
  # (`./gradlew verify`) rather than being restated as a list of steps here -- a second copy is a
  # second place for it to drift, and this project has already been bitten by a suite nothing ran.
  # `build` excludes the chaos and soak suites; `verify` is what runs them, and it runs on every
  # JDK in the matrix rather than on the baseline alone. See docs/dev/10-testing.md.
  gradle-build:
    name: Gradle Build and Verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        java: [ '11', '17', '21', '25' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Build and verify
        run: ./gradlew --no-daemon --stacktrace --continue clean build verify
