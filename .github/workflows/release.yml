name: Release

on:
  workflow_dispatch:
    inputs:
      publish_mode:
        description: "Publishing mode"
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - release
          # Back-fills the container image onto a version already on Central. Releases from here on
          # publish both in `release` mode, so this is for versions cut before the image existed.
          - image
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    # `verify` runs inside this job: the full suite, then the upload.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11 (release baseline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Resolve publish mode
        id: mode
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            mode="release"
          else
            mode="${{ inputs.publish_mode }}"
          fi
          echo "publish_mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Validate version and secrets
        shell: bash
        env:
          PUBLISH_MODE: ${{ steps.mode.outputs.publish_mode }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_GPG_SECRET_KEY: ${{ secrets.SIGNING_GPG_SECRET_KEY }}
          SIGNING_GPG_PASSWORD: ${{ secrets.SIGNING_GPG_PASSWORD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < version.txt)"
          if [[ -z "${version}" ]]; then
            echo "version.txt is empty"
            exit 1
          fi

          # Sonatype is not involved in image mode: nothing is uploaded to Central there.
          if [[ "${PUBLISH_MODE}" != "image" ]]; then
            if [[ -z "${SONATYPE_USERNAME}" || -z "${SONATYPE_PASSWORD}" ]]; then
              echo "Missing SONATYPE_USERNAME or SONATYPE_PASSWORD secret"
              exit 1
            fi
          fi

          if [[ "${PUBLISH_MODE}" == "snapshot" ]]; then
            if [[ "${version}" != *-SNAPSHOT ]]; then
              echo "Snapshot mode requires version ending with -SNAPSHOT. Current version: ${version}"
              exit 1
            fi
          else
            if [[ "${version}" == *-SNAPSHOT ]]; then
              echo "Modes release and image require a non-snapshot version. Current version: ${version}"
              exit 1
            fi
            if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
              echo "Modes release and image require DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets"
              exit 1
            fi
          fi

          if [[ "${PUBLISH_MODE}" == "release" ]]; then
            if [[ -z "${SIGNING_GPG_SECRET_KEY}" || -z "${SIGNING_GPG_PASSWORD}" ]]; then
              echo "Release mode requires SIGNING_GPG_SECRET_KEY and SIGNING_GPG_PASSWORD secrets"
              exit 1
            fi
          fi

      # Toolchain and credentials for the image, in the same role `setup-java` plays above. QEMU is
      # what lets the arm64 half of the manifest build on an amd64 runner.
      - name: Set up QEMU
        if: steps.mode.outputs.publish_mode != 'snapshot'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.mode.outputs.publish_mode != 'snapshot'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.mode.outputs.publish_mode != 'snapshot'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish artifacts
        shell: bash
        env:
          PUBLISH_MODE: ${{ steps.mode.outputs.publish_mode }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_GPG_SECRET_KEY: ${{ secrets.SIGNING_GPG_SECRET_KEY }}
          SIGNING_GPG_PASSWORD: ${{ secrets.SIGNING_GPG_PASSWORD }}
        # `verify` ahead of `publish`, in one invocation: what is uploaded is what has just passed
        # the whole suite, rather than a rebuild of it from a second checkout. `image` mode is the
        # exception -- the jars for that version already passed it on their own release run.
        run: |
          case "${PUBLISH_MODE}" in
            snapshot)
              ./gradlew --no-daemon --stacktrace clean verify publish
              ;;
            release)
              ./gradlew --no-daemon --stacktrace clean verify publish \
                  uploadArtifactsToSonatypeCentralPortal dockerPublish
              ;;
            image)
              ./gradlew --no-daemon --stacktrace clean build dockerPublish
              ;;
            *)
              echo "Unknown publish mode: ${PUBLISH_MODE}"
              exit 1
              ;;
          esac
